# Codex CLI configuration — Tier 1 base template

# --- Sandbox / Approval policy ---
# Host default: workspace-write + on-request.
# - workspace-write: allows file edits / shell execution inside the workspace; blocks external network and system writes
# - on-request: asks for approval only when the model deems it necessary
#
# IMPORTANT — DevContainer execution:
#   Under Docker's default seccomp profile, which the template's Compose file
#   keeps, the bubblewrap sandbox cannot create user namespaces, and
#   sandboxed shell calls from a DevContainer shell fail with
#   "bwrap: No permissions to create new namespace".
#   In that case use the README/REFERENCE.md flag for headless invocations
#   from inside the container:
#     codex exec --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox "<prompt>" </dev/null
#   This is a compatibility measure, not a security boundary: commands run
#   unsandboxed, and docker.sock grants host-level power. Outside containers,
#   keep this workspace-write default.
#   See REFERENCE.md §"Codex sandbox bypass (DevContainer only)".
#
# NOTE: per TOML rules, top-level keys must precede any [section] header.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[features]
hooks = true
